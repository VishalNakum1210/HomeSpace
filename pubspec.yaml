name: homespace
description: "HomeSpace — a playful family photo library. Android frontend."
publish_to: 'none'
version: 0.5.0+8

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/photos/
    - assets/illustrations/
    - assets/fonts/OFL.txt
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 700
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 900
