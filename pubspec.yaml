name: homespace
description: "HomeSpace — a playful family photo library. Android frontend."
publish_to: 'none'
version: 0.8.1+16

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  http: ^1.6.0
  http_parser: ^4.1.2
  image_picker: ^1.2.4
  mime: ^2.0.0
  path_provider: ^2.1.6
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/photos/
    - assets/illustrations/auth-layout-approved.png
    - assets/illustrations/vector/
    - assets/fonts/OFL.txt
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 700
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 900
